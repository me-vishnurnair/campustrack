# Deployment for Vishnu's existing Render workspace.
# The PostgreSQL instance is referenced, never duplicated or embedded in source.
services:
  - type: web
    name: vishnu-campustrack
    runtime: python
    region: singapore
    plan: free
    repo: https://github.com/me-vishnurnair/campustrack
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: APP_ENV
        value: production
      - key: APP_ORIGIN
        fromService:
          type: web
          name: vishnu-campustrack
          envVarKey: RENDER_EXTERNAL_URL
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: vishnu-campustrack-db
          property: connectionString
